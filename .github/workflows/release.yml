name: Auto Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build zip (exclude tooling)
        run: |
          git archive --format=zip \
            --prefix=sborka-mc-main/ \
            --output=sborka.zip \
            HEAD \
            -- . \
            ':(exclude)update.bat' \
            ':(exclude).github' \
            ':(exclude).gitignore' \
            ':(exclude).last_commit'\
            ':(exclude)config'

      - name: Delete previous 'latest' release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new release
        run: |
          gh release create latest \
            sborka.zip \
            update.bat \
            --title "Latest build (${{ steps.sha.outputs.short }})" \
            --notes "Auto-built from commit ${{ steps.sha.outputs.short }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}